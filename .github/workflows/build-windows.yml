# Windows 설치 파일(.exe)을 GitHub 서버의 Windows 환경에서 만든다.
# - main에 올라가면: package.json의 버전(v0.1.0 등)으로 Releases에 설치 파일을 올린다.
#   같은 버전이면 기존 Release의 파일을 새 파일로 바꾼다.
# - Actions 탭에서 직접 실행해도 된다.
name: Windows 설치 파일 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: PaperReader-Setup
          path: release/*.exe
      - id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 논문 리더 v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
