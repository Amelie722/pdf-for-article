# Windows 설치 파일(.exe)을 GitHub 서버의 Windows 환경에서 만든다.
# - v로 시작하는 태그(예: v0.1.0)를 올리면: 설치 파일을 만들어 Releases에 올린다.
# - Actions 탭에서 직접 실행하면: 설치 파일을 Artifacts로 내려받을 수 있다.
name: Windows 설치 파일 만들기

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: PaperReader-Setup
          path: release/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
